# The live demo: the demo owner's page, published as it is committed.
# dashboards/ is what the template and findata/ build (T1), so nothing is rebuilt here.
name: Live demo

on:
  push:
    branches: [main]
    paths: [dashboards/finance_dashboard.html]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: mkdir _site && cp dashboards/finance_dashboard.html _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
