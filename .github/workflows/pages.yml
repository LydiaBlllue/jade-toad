# The live demo: the demo owner's page, published as it is committed, behind a front door
# (docs/site/index.html) that sends a wide screen straight to it and shows a phone the screenshots.
# dashboards/ is what the template and findata/ build (T1), so nothing is rebuilt here.
name: Live demo

# Every push to main redeploys, whatever it changed (2026-10-29, user 001): a release is a
# release, and the demo is never left on an older build than the repository says it is.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p _site/screens
          cp docs/site/index.html docs/logo.svg _site/
          cp dashboards/finance_dashboard.html _site/dashboard.html
          cp docs/screens/*.png _site/screens/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
